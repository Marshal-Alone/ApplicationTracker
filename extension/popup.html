<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApplicationTracker Assistant</title>
  <style>
    :root {
      --bg-page: #fafafa;
      --bg-card: #ffffff;
      --bg-raised: #f4f4f5;
      --ink-primary: #171717;
      --ink-secondary: #525252;
      --ink-muted: #696969;
      --hairline: rgba(23, 23, 23, 0.1);
      --hairline-strong: rgba(23, 23, 23, 0.18);
      --accent: #1b4ad6;
      --accent-tint: rgba(27, 74, 214, 0.08);
      --positive: #15803d;
      --positive-bg: #f0fdf4;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --warn: #b45309;
      --warn-bg: #fffbeb;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 300px;
      height: 100vh;
      min-height: 480px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-page);
      color: var(--ink-primary);
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    @media (max-width: 350px) {
      .form-row {
        grid-template-columns: 1fr !important;
      }
    }

    *:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--hairline);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .logo {
      width: 28px;
      height: 28px;
      background: var(--ink-primary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-primary);
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--ink-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ink-muted);
    }

    .status-dot.ready {
      background: var(--positive);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      color: var(--ink-secondary);
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 150ms var(--ease), color 150ms var(--ease);
    }

    .icon-btn:hover {
      background: var(--bg-raised);
      color: var(--ink-primary);
    }

    .queue-banner {
      background: var(--warn-bg);
      color: var(--warn);
      border-bottom: 1px solid rgba(180, 83, 9, 0.18);
      padding: 6px 16px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .queue-banner.hidden {
      display: none;
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-weight: 500;
      font-size: 12px;
      cursor: pointer;
    }

    .link-btn:hover {
      text-decoration: underline;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .empty-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .empty-icon {
      width: 44px;
      height: 44px;
      background: var(--bg-card);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-secondary);
      margin-bottom: 16px;
    }

    .empty-view h3 {
      font-size: 15px;
      font-weight: 500;
      color: var(--ink-primary);
      margin-bottom: 6px;
    }

    .empty-view p {
      font-size: 13px;
      line-height: 1.5;
      color: var(--ink-secondary);
      margin-bottom: 20px;
      max-width: 300px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--hairline);
      border-top-color: var(--ink-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hint-bar {
      background: var(--bg-raised);
      border-bottom: 1px solid var(--hairline);
      padding: 8px 16px;
      font-size: 12px;
      color: var(--ink-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 500;
      background: var(--bg-card);
      border: 1px solid var(--hairline);
      color: var(--ink-secondary);
    }

    .chip-accent {
      background: var(--accent-tint);
      border-color: rgba(27, 74, 214, 0.2);
      color: var(--accent);
    }

    .fresher-panel {
      background: var(--bg-card);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 12px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .fresher-panel.warn {
      background: var(--warn-bg);
      border-color: rgba(180, 83, 9, 0.22);
    }

    .fresher-panel.ok {
      background: var(--positive-bg);
      border-color: rgba(21, 128, 61, 0.22);
    }

    .fresher-title {
      font-weight: 600;
      color: var(--ink-primary);
    }

    .fresher-sub {
      font-size: 11px;
      color: var(--ink-secondary);
    }

    .ai-edit-item {
      border-left: 2px solid var(--accent);
      padding-left: 8px;
      margin-top: 4px;
      font-size: 11px;
      color: var(--ink-secondary);
    }

    .ai-inline-btn {
      height: 26px;
      padding: 0 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      border: 1px solid var(--hairline-strong);
      background: var(--bg-card);
      color: var(--ink-primary);
      cursor: pointer;
    }

    .ai-inline-btn:hover {
      background: var(--bg-raised);
    }

    .ai-inline-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .job-form {
      flex: 1;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .form-group label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 500;
      color: var(--ink-secondary);
      margin-bottom: 4px;
      font-size: 12px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--hairline-strong);
      border-radius: 8px;
      font-size: 13px;
      color: var(--ink-primary);
      background: var(--bg-card);
      font-family: inherit;
      resize: none;
      transition: border-color 150ms var(--ease);
    }

    .form-group textarea {
      height: 60px;
    }

    .req-preview {
      background: var(--bg-card);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      padding: 8px 10px;
      max-height: 110px;
      overflow-y: auto;
      font-size: 12px;
      color: var(--ink-secondary);
    }

    .req-preview ul {
      list-style: disc;
      padding-left: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .actions {
      padding: 12px 16px;
      border-top: 1px solid var(--hairline);
      background: var(--bg-card);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid transparent;
      transition: background-color 150ms var(--ease), opacity 150ms var(--ease), transform 150ms var(--ease);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--ink-primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #2b2b2b;
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--ink-primary);
      border-color: var(--hairline-strong);
    }

    .btn-secondary:hover {
      background: var(--bg-raised);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 500;
      border-top: 1px solid var(--hairline);
      flex-shrink: 0;
    }

    .status-success {
      background: var(--positive-bg);
      color: var(--positive);
    }

    .status-error {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .status-info {
      background: var(--warn-bg);
      color: var(--warn);
    }

    .settings-modal {
      position: absolute;
      inset: 0;
      background: var(--bg-card);
      z-index: 100;
      display: none;
      flex-direction: column;
    }

    .settings-modal.active {
      display: flex;
    }

    .settings-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .settings-header h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-primary);
    }

    .settings-body {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .settings-field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-secondary);
      margin-bottom: 4px;
    }

    .settings-field input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--hairline-strong);
      border-radius: 8px;
      font-size: 12px;
      color: var(--ink-primary);
      background: var(--bg-page);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .settings-help {
      font-size: 11px;
      color: var(--ink-muted);
      line-height: 1.4;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="2" y="2.5" width="10" height="2" rx="0.5" fill="currentColor" />
            <rect x="2" y="6" width="6.5" height="2" rx="0.5" fill="currentColor" fill-opacity="0.85" />
            <rect x="2" y="9.5" width="4" height="2" rx="0.5" fill="#608cff" />
          </svg>
        </div>
        <div>
          <div class="brand-title">ApplicationTracker</div>
          <div class="brand-sub">
            <span id="keyStatusDot" class="status-dot"></span>
            <span id="keyStatusText">Local mode</span>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <button id="scanTabBtn" class="icon-btn" title="Scan active browser tab" aria-label="Scan active browser tab">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
          </svg>
        </button>

        <button id="openAppBtn" class="icon-btn" title="Open ApplicationTracker web app" aria-label="Open web app">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
            <polyline points="15 3 21 3 21 9" />
            <line x1="10" y1="14" x2="21" y2="3" />
          </svg>
        </button>

        <button id="settingsBtn" class="icon-btn" title="Extension settings" aria-label="Extension settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>
    </header>

    <div id="queueBanner" class="queue-banner hidden">
      <span id="queueText">0 queued locally</span>
      <button id="syncQueueBtn" class="link-btn" type="button">Sync now</button>
    </div>

    <main class="content" id="content"></main>

    <!-- Settings Panel -->
    <div id="settingsModal" class="settings-modal" role="dialog" aria-label="Account and server settings">
      <div class="settings-header">
        <h3>Connection settings</h3>
        <button id="closeSettingsBtn" class="icon-btn" aria-label="Close settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="settings-body">
        <div class="settings-field">
          <label for="settingApiKey">Personal API key</label>
          <input type="text" id="settingApiKey" placeholder="jt_..." />
          <p class="settings-help">Copy your API key from ApplicationTracker Settings or the Extension Key menu.</p>
        </div>

        <div class="settings-field">
          <label for="settingBackendUrl">Backend server URL</label>
          <input type="text" id="settingBackendUrl" value="http://localhost:3001" placeholder="http://localhost:3001" />
        </div>

        <div class="settings-field">
          <label for="settingWebUrl">Web dashboard URL</label>
          <input type="text" id="settingWebUrl" value="http://localhost:8081" placeholder="http://localhost:8081" />
        </div>

        <div class="settings-field">
          <label for="settingGeminiKey">Gemini API key (optional)</label>
          <input type="password" id="settingGeminiKey" placeholder="AIza... (or use server GEMINI_API_KEY)" />
        </div>

        <div class="settings-field" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 4px; border-top: 1px solid var(--hairline);">
          <div>
            <div style="font-size: 12px; font-weight: 500; color: var(--ink-secondary);">Domain selector cache</div>
            <div id="selectorCacheInfo" class="settings-help" style="margin-top: 2px;">0 startup/ATS domains cached</div>
          </div>
          <button id="clearSelectorCacheBtn" type="button" class="ai-inline-btn">Clear cache</button>
        </div>

        <div id="settingsTestStatus" style="font-size: 12px; color: var(--ink-muted);"></div>

        <div style="display: flex; gap: 8px; margin-top: auto;">
          <button id="testConnectionBtn" type="button" class="btn btn-secondary" style="flex: 1;">
            Test key
          </button>
          <button id="saveSettingsBtn" type="button" class="btn btn-primary" style="flex: 1.2;">
            Save settings
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
