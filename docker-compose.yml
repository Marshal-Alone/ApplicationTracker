version: '3.8'

services:
  mongodb:
    image: mongo:6-jammy
    container_name: jobtracker-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: jobtracker
    volumes:
      - mongodb_data:/data/db
    networks:
      - jobtracker-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobtracker-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/jobtracker
      - JWT_SECRET=super-secret-jwt-key-replace-in-production-123456
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - jobtracker-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobtracker-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - jobtracker-network

networks:
  jobtracker-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
